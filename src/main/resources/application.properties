spring.application.name=api-gateway

server.port=${PORT:8080}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Server Webflux Routes Configuration
# 1. User Service
spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=${USER_SERVICE_URL:lb://USER-SERVICE}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[0].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 2. Product Service
spring.cloud.gateway.server.webflux.routes[1].id=product-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCT_SERVICE_URL:lb://PRODUCT-SERVICE}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 3. Order Service
spring.cloud.gateway.server.webflux.routes[2].id=order-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL:lb://ORDER-SERVICE}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/order-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[2].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 4. Email Service
spring.cloud.gateway.server.webflux.routes[3].id=email-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=${EMAIL_SERVICE_URL:lb://EMAIL-SERVICE}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/email-service/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[3].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# 5. Payment Service
spring.cloud.gateway.server.webflux.routes[4].id=payment-service-route
spring.cloud.gateway.server.webflux.routes[4].uri=${PAYMENT_SERVICE_URL:lb://PAYMENT-SERVICE}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payment-service/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[4].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
